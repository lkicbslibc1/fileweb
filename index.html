
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Work: File System</title>
  <link rel="stylesheet" href="user.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>
  <div class="container">
    <div id="loginSection">
      <h2>Login</h2>
      <input type="text" id="loginUser" placeholder="Username" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button onclick="login()">Login</button>
      <span class="link-text" onclick="showRegister()">Register</span>
    </div>

    <div id="registerSection" class="hidden">
      <h2>Register</h2>
      <input type="text" id="regUser" placeholder="Username" />
      <input type="password" id="regPass" placeholder="Password" />
      <button onclick="register()" style="background-color: #28a745">
        Register
      </button>
      <span class="link-text" onclick="showLogin()">Back to login</span>
    </div>

    <div id="appSection" class="hidden">
      <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          ">
        <h4 id="welcomeMsg" style="margin: 0">Welcome</h4>
        <button onclick="logout()" class="secondary-btn" style="width: auto; padding: 5px 15px; margin: 0">
          Logout
        </button>
      </div>
      <hr />

      <h5>อัปโหลดไฟล์ (Upload)</h5>
      <input type="file" id="fileInput" />
      <button onclick="uploadFile()">Upload File</button>
      <p id="uploadStatus" style="color: green; font-size: 0.9rem"></p>

      <h3 style="text-align: left; margin-top: 30px">รายการไฟล์ของคุณ</h3>
      <ul id="fileList"></ul>
    </div>
  </div>

  <script>
    const serverUrl = "http://localhost:5000";
    let currentId = localStorage.getItem("id");
    let currentUser = localStorage.getItem("username");
    let currentRole = localStorage.getItem("role");

    // --- 2. ฟังก์ชันเช็คตอนเปิดหน้าเว็บว่าเคย Login ค้างไว้มั้ย ---
    // (เอามาวางไว้นอกฟังก์ชัน เพื่อให้ทำงานทันทีที่เปิดเว็บ)
    if (currentUser && currentRole) {
      showApp(); // ถ้ามีข้อมูลค้างอยู่ ให้ข้ามไปหน้า App เลย
    }

    function showApp() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("registerSection").classList.add("hidden");
      document.getElementById("appSection").classList.remove("hidden");
      document.getElementById("welcomeMsg").innerHTML =
        `User: ${currentUser} <span class="role-badge">${currentRole}</span>`;
      loadFileList();
    }

    // --- ฟังก์ชันสลับหน้า (เหมือนเดิม) ---
    function showRegister() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("registerSection").classList.remove("hidden");
    }
    function showLogin() {
      document.getElementById("registerSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
    }

    // --- Register (เหมือนเดิม) ---
    function register() {
      const user = document.getElementById("regUser").value;
      const pass = document.getElementById("regPass").value;
      if (!user || !pass) return alert("Please fill in all fields.");

      fetch(`${serverUrl}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.success) {
            alert("Registration successful! Please log in.");
            showLogin();
            document.getElementById("regUser").value = "";
            document.getElementById("regPass").value = "";
          } else {
            alert(data.message);
          }
        });
    }

    // --- 3. Login (แก้ไขให้บันทึกใส่ localStorage) ---
    function login() {
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;

      fetch(`${serverUrl}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.success) {
            // จำค่าลงเครื่อง!
            localStorage.setItem("id", data.id);
            localStorage.setItem("username", data.username);
            localStorage.setItem("role", data.role);

            // อัปเดตตัวแปร
            currentId = data.id
            currentUser = data.username;
            currentRole = data.role;

            showApp();
          } else {
            alert(data.message);
          }
        });
    }

    // --- Upload (เหมือนเดิม) ---
    function uploadFile() {
      const userId = localStorage.getItem("id");
      const fileInput = document.getElementById("fileInput").files[0];

      const formData = new FormData();
      formData.append("file", fileInput);
      formData.append("ownerId", userId);
      formData.append("ownerName", currentUser);

      fetch(`${serverUrl}/upload`, {
        method: "POST",
        body: formData,
        headers: { "user-id": userId }
      }).then(res => res.json())
        .then(data => {
          document.getElementById("uploadStatus").innerText = "✅ " + data.message;
          document.getElementById("fileInput").value = ""; // ล้างช่องเลือกไฟล์
          loadFileList(); // รีโหลดรายการไฟล์ใหม่ทันที
        })
        .catch(err => alert("เกิดข้อผิดพลาดในการอัปโหลด"));
    }

    // function loadFileList() {
    //   fetch(`${serverUrl}/files?role=${currentRole}&username=${currentUser}`)
    //     .then((res) => res.json())
    //     .then((files) => {
    //       const list = document.getElementById("fileList");
    //       list.innerHTML = "";
    //       if (files.length === 0)
    //         list.innerHTML = '<p style="color:#aaa">No files found.</p>';

    //       files.forEach((f) => {
    //         list.innerHTML += `<li>${f} <a href="${serverUrl}/download/${currentId}/${f}" download>Download</a></li>`;
    //       })
    //     });
    // }
    // --- แก้ไขฟังก์ชัน loadFileList ให้แสดงผลแบบการ์ด ---
    function loadFileList() {
      fetch(`${serverUrl}/files?role=${currentRole}&username=${currentUser}`)
        .then((res) => res.json())
        .then((files) => {
          const list = document.getElementById("fileList");
          list.innerHTML = "";

          files.forEach((f) => {
            // --- วางบรรทัดที่ถามไว้ตรงนี้ครับ ---
            const previewUrl = `${serverUrl}/preview/${currentId}/${f}`;
            const downloadUrl = `${serverUrl}/download/${currentId}/${f}`;
            // ------------------------------

            const ext = f.split('.').pop().toLowerCase();
            const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);

            if (isImage) {
              thumbnailHtml = `<img src="${previewUrl}" class="file-thumb">`;
            } else {
              // --- กำหนดไอคอนตามนามสกุลไฟล์ ---
              let iconClass = "fa-file-alt"; // ไอคอนเริ่มต้น (เอกสารทั่วไป)
              let iconColor = "#94a3b8";   // สีเริ่มต้น (เทา)

              if (ext === 'pdf') {
                iconClass = "fa-file-pdf";
                iconColor = "#ef4444"; // สีแดง
              } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
                iconClass = "fa-file-audio";
                iconColor = "#f59e0b"; // สีส้ม
              } else if (['mp4', 'mov', 'avi'].includes(ext)) {
                iconClass = "fa-file-video";
                iconColor = "#3b82f6"; // สีน้ำเงิน
              } else if (['zip', 'rar', '7z'].includes(ext)) {
                iconClass = "fa-file-archive";
                iconColor = "#8b5cf6"; // สีม่วง
              }

              thumbnailHtml = `
  <div class="file-icon" data-ext="${ext}" style="color: ${iconColor};">
    <i class="fas ${iconClass}"></i>
  </div>`;
            }
            list.innerHTML += `
          <li class="file-card">
            <div class="file-preview-container">${thumbnailHtml}</div>
            <div class="file-info"><span class="file-name">${f}</span></div>
            <div class="file-actions">
              <a href="${downloadUrl}" download class="btn-download">Download</a>
            </div>
          </li>`;
          });
        });
    }

    function logout() {
      localStorage.clear(); // ล้างข้อมูลที่จำไว้
      location.reload(); // รีเฟรชกลับไปหน้าแรก
    }

    document.getElementById('fileInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const previewArea = document.getElementById('uploadStatus');
          previewArea.innerHTML = `<img src="${event.target.result}" 
        style="width: 100px; height: 100px; object-fit: cover; border-radius: 10px; margin-top: 10px; border: 2px solid #ddd;">`;
        };
        reader.readAsDataURL(file);
      }
    });

  </script>
</body>

</html>
